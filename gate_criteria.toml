# ─────────────────────────────────────────────────────────────
# 회귀 게이트 합격 기준 (v1.1)
#
# src/compare_runs.py 가 이 파일을 읽어 "후보 실행(candidate)"의 합격 여부를 판정한다.
# 숫자를 코드에 박지 않고 이 파일로 뺀 이유:
#   - 기준을 바꿀 때 코드를 건드리지 않는다 (기준 변경 = 이 파일의 git diff 한 줄)
#   - 기준마다 "왜 이 값인지"를 주석으로 옆에 남길 수 있다 (JSON은 주석 불가)
#   - TOML은 Python 3.11+ 표준 라이브러리(tomllib)로 읽혀 의존성이 늘지 않는다
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.1"
# 게이트를 적용할 모델. 비교 대조군(llama3.1:8b)은 탈락 모델이므로 기본 대상에서 뺀다.
# 대조군까지 보고 싶으면 --model 옵션으로 지정한다.
target_models = ["qwen2.5:7b"]


# ── 절대 기준 ────────────────────────────────────────────────
# 기준선과 상관없이 후보 실행이 "단독으로" 넘어야 하는 바닥선.
# 기준선 자체가 나빴다면 상대 비교만으로는 "똑같이 나쁨 = 통과"가 되므로 따로 둔다.
[absolute]

# 호출 실패가 1건이라도 있으면 그 회차의 품질은 측정 자체가 안 된 것이다.
success_rate_min = 100.0

# STRICT(R1~R6 전부 통과). n=20 기준 95% = 1건까지 허용.
# 시드 미고정이라 우연한 1건 흔들림까지 막으면 게이트가 늘 빨간불이 된다.
strict_rate_min = 95.0

# PARSABLE(R4 빈 줄만 허용). 파서가 못 읽으면 Jira 자동 등록이 깨지므로 예외 없음.
parsable_rate_min = 100.0

# R1(서두 사족)·R6(enum 이탈)은 파싱 계약 위반 중에서도 치명적인 것이라 개별로 0건을 요구한다.
preamble_fail_max = 0
enum_fail_max = 0

# 평균 응답 지연 상한(초). v1.0 Qwen 1.390초 대비 약 40% 여유.
# 절대값은 장비에 묶이므로, 다른 PC에서 돌릴 때는 이 값을 먼저 조정할 것.
latency_sec_max = 2.0


# ── 상대(회귀) 기준 ──────────────────────────────────────────
# 기준선 대비 "얼마나 나빠졌는가"의 허용폭.
# 바닥선 위에 있더라도 급격히 나빠졌다면 원인을 봐야 하므로 따로 잡는다.
[regression]

# STRICT 준수율 하락 허용폭 (퍼센트포인트). n=20에서 1건 = 5%p.
strict_rate_drop_max_pp = 5.0

# 평균 지연 증가 허용폭 (%). 같은 PC에서도 백그라운드 부하로 10% 안팎은 흔들린다.
latency_increase_max_pct = 20.0

# 토큰 생성 속도 하락 허용폭 (%). 양자화·드라이버·Ollama 버전 변화를 잡아내는 신호.
tokens_per_sec_drop_max_pct = 15.0

# 평균 생성 토큰 증가 허용폭 (%). 출력이 장황해지면 지연과 사족 위험이 같이 오른다.
eval_count_increase_max_pct = 30.0
