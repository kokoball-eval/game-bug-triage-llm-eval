# ─────────────────────────────────────────────────────────────
# v1.5 라벨 일치율 판단 기준 — 평가셋 aether_raid_v14 개발용 63건, 판정 6칸
#
# 계획: report/label_agreement_v15_plan.md
# 채점자에게 판정 시트를 보내기 전에 확정한다 (2026-10-08). 받은 판정을 본 뒤 이 파일의 값을 바꾸지 않는다.
#
# 판단 규칙
#   1. 칸마다 두 채점자 모두가 [field] 기준을 넘으면 그 칸의 라벨을 "신뢰"로 판정한다.
#      한 명이라도 못 넘으면 그 칸의 불일치 문항을 검토한다(계획 §5).
#   2. Critical 측정 문항(X-1)은 칸과 별개로 [critical] 기준을 본다.
#   3. 두 채점자끼리의 κ는 판정 기준이 아니라 참고 지표다. 정답 라벨과 무관하게 기준서 자체의 모호함을 보여 준다.
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.5"
dataset = "v14"
split = "dev"                 # 최종 평가용(final) 25건은 봉인 — 채점자에게 보내지 않는다
raters = ["채점자1", "채점자2"]   # 채점자1 시니어급 QA, 채점자2 주니어급 QA (이름은 공개하지 않는다)
blind_map = "data/label_agreement/blind_map_v15.json"

# ── 칸별 기준 ────────────────────────────────────────────────
# allowed_rate_min: 채점자의 답이 정답 라벨의 허용 답 안에 있는 비율(%)의 하한. 모델 채점과 같은 함수(score.field_correct)로 잰다.
# kappa_min: 채점자 답과 정답 최선 답(허용 답의 첫 값) 사이 Cohen κ의 하한.
#            0.61은 Landis·Koch(1977) 구간에서 "상당한 일치"가 시작되는 값이다.
# 처리·분류·우선순위는 게이트에서 하락을 0~2로 엄하게 보는 칸이라 라벨도 엄하게 본다.
# 모듈·재현 정보·발생 빈도는 틀려도 뒤 단계(재배정·재현)에서 바로잡을 수 있는 칸이라 일치율만 본다.
[field."처리"]
allowed_rate_min = 85.0
kappa_min = 0.61

[field."분류"]
allowed_rate_min = 85.0
kappa_min = 0.61

[field."우선순위"]
allowed_rate_min = 85.0
kappa_min = 0.61

[field."모듈"]
allowed_rate_min = 75.0

[field."재현 정보"]
allowed_rate_min = 75.0

[field."발생 빈도"]
allowed_rate_min = 75.0

# ── Critical 측정 문항 ───────────────────────────────────────
# 정답이 Critical인 문항(risk X-1, 개발용 20건)에서 채점자가 우선순위를 Critical로 두거나 처리를 긴급 사인 요청으로 둔 비율(%)의 하한.
# 못 넘으면 "이 문항의 정답은 Critical"이라는 전제부터 다시 검토한다. 가장 비싼 실수(Critical 누락)를 재는 라벨이기 때문이다.
[critical]
recall_min = 90.0
