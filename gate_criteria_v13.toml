# ─────────────────────────────────────────────────────────────
# v1.3 회귀 게이트 합격 기준 (평가셋 aether_raid_v13, 출력 형식 v2)
#
# src/triage_eval/pipeline/gate.py 가 이 파일을 읽어 후보 실행이 기준선보다 나빠졌는지 판정한다.
# v1.0 10문항용 게이트(gate_criteria.toml, compare_runs.py)와는 별개다.
#
# 허용폭은 퍼센트가 아니라 "응답 수"로 적는다. 개발용 32문항 × 2회 = 64응답이라
# 응답 1개가 정답률 1.56%p에 해당하고, 결과는 이 단위로만 움직이기 때문이다.
# 같은 seed·같은 프롬프트면 응답이 재현되므로(v1.2 실측), 바뀐 결과는 노이즈가 아니라 변경의 효과다.
# 허용폭은 "한 곳을 고칠 때 생기는 작은 부작용을 어디까지 감수하는가"이며, 틀렸을 때의 피해 크기로 정했다.
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.3"
target_models = ["qwen2.5:7b"]
# 고정 기준선 — 2026-10-02 개발용 seed 1 실행의 사본. 덮어쓰지 않는다.
baseline = "data/results/v13/baseline/v13_dev_seed1_baseline.json"


# ── 절대 기준 ────────────────────────────────────────────────
# 기준선과 상관없이 후보 실행이 단독으로 지켜야 하는 바닥선.
[absolute]

# 호출 실패가 있으면 그 문항은 측정되지 않은 것이다.
success_rate_min = 100.0

# 날조 — 입력에 없는 기기·조건을 지어낸 티켓은 개발자가 존재하지 않는 조건으로 재현을 시도하게 만든다.
hallucination_max = 0

# X-2 결함 폐기 — 폐기된 결함은 아무도 다시 보지 않는다.
x2_miss_max = 0

# X-3 경계 건 확정 처리 — 부서마다 판정이 갈리는 건을 사람 확인 없이 끝내면 안 된다.
x3_miss_max = 0

# 출력 언어 위반(R7) — 응답 도중 다른 언어로 넘어간 티켓은 담당자가 읽을 수 없다.
# 프롬프트 v2.1 측정에서 처음 확인된 실패 유형이라 추가했다 (docs/issue_log.md ISSUE-007).
language_violation_max = 0

# 허용 값 위반(R6) — 최종 출력(BTS에 들어가는 결과)에 허용 값 밖인 값('무관 중', '중소' 등)이 남은 응답.
# 운영 파서가 읽지 못하고, 존재하지 않는 분류·우선순위가 티켓에 기록된다. 재요청(구조화 출력)으로 막을 수 있으므로
# 기준선(7건)과 비교하지 않고 0건을 요구한다. 형식 STRICT 하락 기준(회귀)과 별개의 바닥선이다 (ISSUE-007).
enum_violation_max = 0


# ── 회귀 기준 ────────────────────────────────────────────────
# 기준선 대비 허용 악화폭. X-1 누락 0건은 최종 목표(v1.5)이고, v1.3에서는 "늘지 않을 것"만 요구한다.
[regression]

# X-1 Critical 미상신 — 사고로 직결되므로 트레이드오프를 허용하지 않는다.
x1_miss_increase_max = 0

# 과잉 상신(허용 답에 없는 긴급 사인 요청) — 피해는 리드 QA 사인 업무 증가. 1문항 × 2회까지 감수한다.
over_escalation_increase_max = 2

# 형식 STRICT·PARSABLE 하락(응답 수) — 형식이 깨지면 운영 파서가 읽지 못해 처리 자체가 되지 않는다.
format_drop_max_responses = 2

# 평균 지연 증가(%) — 같은 PC에서도 백그라운드 부하로 10% 안팎은 흔들린다.
latency_increase_max_pct = 20.0


# 칸별 정답률(허용 답 기준) 하락 허용폭, 응답 수
# 처리·분류 > 우선순위 > 나머지 — 틀렸을 때 뒤 단계에서 바로잡을 기회가 적을수록 엄격하게 둔다.
[regression.field_drop_max_responses]
"처리" = 0        # 티켓이 가는 곳을 정한다. 틀리면 잘못된 대기열로 가거나 버려진다
"분류" = 0        # 처리를 정하는 출발점. 틀리면 처리가 연쇄로 틀어진다
"우선순위" = 1    # 리드 QA 사인 큐와 개발 일정에 직결된다. Major↔Minor는 재현 단계에서 조정 가능
"모듈" = 3        # 담당자 오배정은 받은 담당자가 재배정할 수 있다
"재현 정보" = 3   # 정보 요청 여부가 달라지며, 개발 QA 재현 단계에서 확인된다
"발생 빈도" = 3   # 위와 같다
"6칸 정답" = 3    # 6칸이 모두 허용 답 안에 있는 응답


# 문항 단위 회귀 허용폭, 응답 수 — 기준선에서 맞힌 응답이 후보에서 틀리게 바뀐 수.
# 정답률이 같아도 "새로 맞힌 5건 + 새로 틀린 5건"이면 잘 처리되던 이슈가 엉뚱한 곳으로 가기 시작한 것이다.
# 정답률 하락이 0으로 막혀 있으므로 이 값을 0으로 두면 경계 문항 하나 때문에 큰 개선이 모두 막힌다.
# 여기에 없는 칸도 문항 단위 변화는 판정 결과에 목록으로 남는다.
[regression.item_regression_max_responses]
"처리" = 2
"분류" = 2
