[project]
name = "game-bug-triage-eval"
version = "0.1.0"
description = "게임 버그 리포트 1차 트리아지용 로컬 LLM(Qwen2.5-7B vs Llama-3.1-8B) 비교·선정 벤치마크"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "openai>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# src/ 의 스크립트를 테스트에서 import 할 수 있게 경로에 추가
pythonpath = ["src"]
testpaths = ["tests"]
