# ─────────────────────────────────────────────────────────────
# v1.4 모델 선택 기준 (평가셋 aether_raid_v13 개발용, 출력 형식 v2)
#
# src/triage_eval/pipeline/selection.py 가 이 파일을 읽어 현재 선정 모델을 후보 모델로 바꿀지 판정한다.
# 절대 기준·회귀 기준의 값은 아래 gate_criteria 가 가리키는 회귀 게이트 기준 파일을 그대로 쓴다.
# 규칙이 두 곳에 있으면 한쪽만 고쳐졌을 때 게이트와 모델 선택이 어긋나기 때문이다.
# 단, 게이트의 "평균 지연 증가 20% 이하"는 같은 모델에서 프롬프트를 고칠 때의 기준이라 모델 비교에서는 빼고,
# 아래 latency_max_sec 를 절대 기준으로 쓴다(증가율은 참고로만 기록).
#
# 교체 결정 규칙 (selection.py 설계 의도 5, 측정 전 2026-10-02 확정)
#   1. seed 3개 모두에서 절대·회귀 기준을 통과한 후보만 교체 대상이 된다.
#   2. 그중 seed 합계로 X-1 누락이 줄었거나, 같으면 우선순위 정답이 늘어난 후보만 교체한다.
#   3. 개선이 없으면 현재 모델을 유지한다. 교체 대상이 여럿이면
#      X-1 누락 합계 → 우선순위 정답 합계 → 평균 지연 순으로 고른다.
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.4"
baseline_model = "qwen2.5:7b"
seed_runs = 3          # seed 1·11·21 — v2.3/v2.4 비교(ISSUE-007)와 같은 seed
gate_criteria = "gate_criteria_v13.toml"

[absolute]
# 1건당 평균 응답 시간(초). 형식 재요청·폐기 확인 시간을 포함한다.
# 사람의 BTS 작성 시간(평균 3~5분)에 비해 병목이 되지 않고, 업데이트 직후 제보가 몰려도
# PC 1대로 시간당 360건을 처리할 수 있는 값이다.
latency_max_sec = 10.0
